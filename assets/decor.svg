<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" fill="none" aria-hidden="true">
  <!-- Official UMKA mark fragments + extras, 8 figures on the right from Wednesday down -->

  <!-- 1. Pink horizontal hourglass: two semicircles facing each other )( -->
  <g fill="#E39B8C" transform="translate(122 122)">
    <path d="M18 0A18 18 0 0 0 18 36Z"/>
    <path d="M20 0A18 18 0 0 1 20 36Z"/>
  </g>

  <!-- 2. Yellow UMKA mark: two circles on two quarter-circles -->
  <g fill="#FABA21" transform="translate(148 108) scale(0.52)">
    <path d="M63.9547 41.9752H43.3418V21.3623c11.3895 0 20.6129 9.2234 20.6129 20.6129z"/>
    <circle cx="53.6133" cy="11.0909" r="10.2715"/>
    <path d="M63.9531 41.9752h20.613V21.3623c-11.3896 0-20.613 9.2234-20.613 20.6129z"/>
    <circle cx="74.2247" cy="11.0909" r="10.2715"/>
  </g>

  <!-- 3. Blue UMKA wing: two quarter-circles back-to-back -->
  <g fill="#6BA4F0" transform="translate(108 148) scale(0.72)">
    <path d="M41.3123 43.9326H0.15625v20.1238c0 11.6691 9.43304 21.1021 21.10205 21.1021h20.1238c0-11.3895-9.2234-20.6129-20.6129-20.6129 11.3895 0 20.6129-9.2235 20.6129-20.613z"/>
  </g>

  <!-- 4. Green clover: four inward quarter-circles + diamond hole -->
  <g fill="#6FCB9A" transform="translate(154 152)">
    <path d="M0 0h18A18 18 0 0 1 0 18Z"/>
    <path d="M36 0H18A18 18 0 0 0 36 18Z"/>
    <path d="M0 36h18A18 18 0 0 0 0 18Z"/>
    <path d="M36 36H18A18 18 0 0 1 36 18Z"/>
    <path fill="#fff" d="M18 13 23 18 18 23 13 18Z"/>
  </g>

  <!-- 5. Light-blue staircase -->
  <g fill="#8EC8F4" transform="translate(188 168)">
    <rect width="13" height="13" y="13"/>
    <rect width="13" height="13" x="13" y="13"/>
    <rect width="13" height="13" x="13"/>
  </g>

  <!-- 6. Yellow circle + star cutout -->
  <g transform="translate(120 204)" fill="#FABA21" fill-rule="evenodd">
    <path d="M24 0a24 24 0 1 1 0 48 24 24 0 0 1 0-48zm0 8.5 5.8 14.6L46 24.2 29.6 31.4 24 46.2 18.4 31.4 2 24.2l16.2-7.1L24 8.5z"/>
  </g>

  <!-- 7. Green UMKA stadium / arch -->
  <g fill="#6FCB9A" transform="translate(118 228) scale(0.55)">
    <path d="M63.9528 85.1585H43.3398V64.5456c0-11.3896 9.2235-20.613 20.613-20.613 11.3895 0 20.6129 9.2234 20.6129 20.613 0 11.3895-9.2234 20.6129-20.6129 20.6129z"/>
  </g>

  <!-- 8. Pink U — UMKA red mark, bowl-like -->
  <g fill="#E39B8C" transform="translate(158 236) scale(0.7)">
    <path d="M20.7692 41.9759C9.37967 41.9759 0.15625 32.7525 0.15625 21.3629V0.75H41.3821v20.6129c0 11.3896-9.2234 20.613-20.6129 20.613z"/>
  </g>
